<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>学员表单</title>
    <link rel="stylesheet" href="../../vendor/layui/layui.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { padding: 20px; background: #fff; }
        .layui-form-item { margin-bottom: 18px; }
        .layui-form-label { width: 90px; }
        .layui-input-inline { width: 280px; }
    </style>
</head>
<body class="admin-embedded-page">
<div class="admin-form-shell">

<form class="layui-form" lay-filter="userForm" id="userForm" style="max-width:600px;">
    <input type="hidden" name="id" id="userId">

    <div class="layui-form-item">
        <label class="layui-form-label"><span style="color:#FF5722;">*</span>用户名</label>
        <div class="layui-input-inline">
            <input type="text" name="username" id="username" required lay-verify="required" placeholder="请输入用户名" class="layui-input" autocomplete="off">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label"><span style="color:#FF5722;">*</span>真实姓名</label>
        <div class="layui-input-inline">
            <input type="text" name="realname" id="realname" required lay-verify="required" placeholder="请输入真实姓名" class="layui-input" autocomplete="off">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">密码</label>
        <div class="layui-input-inline">
            <input type="password" name="password" id="password" placeholder="留空则默认 123456" class="layui-input" autocomplete="new-password">
            <div class="layui-form-mid layui-word-aux" id="passwordHint">新增学员留空则默认密码 123456</div>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">手机号</label>
        <div class="layui-input-inline">
            <input type="text" name="phone" id="phone" placeholder="请输入手机号" class="layui-input" autocomplete="off">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">性别</label>
        <div class="layui-input-inline">
            <input type="radio" name="gender" value="0" title="未知" checked>
            <input type="radio" name="gender" value="1" title="男">
            <input type="radio" name="gender" value="2" title="女">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">公司</label>
        <div class="layui-input-inline">
            <input type="text" name="company" id="company" placeholder="请输入公司名称" class="layui-input" autocomplete="off">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">部门</label>
        <div class="layui-input-inline">
            <input type="text" name="department" id="department" placeholder="请输入部门" class="layui-input" autocomplete="off">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">用户组</label>
        <div class="layui-input-inline">
            <select name="user_group_id" id="userGroupId">
                <option value="">未分组</option>
            </select>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">状态</label>
        <div class="layui-input-inline">
            <input type="checkbox" name="status" id="status" lay-skin="switch" lay-text="正常|禁用" value="1" checked>
        </div>
    </div>

    <div class="layui-form-item">
        <div class="layui-input-block">
            <button class="layui-btn" lay-submit lay-filter="submitBtn"><i class="layui-icon layui-icon-ok"></i> 保存</button>
            <button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
        </div>
    </div>
</form>
</div>

<script src="../../vendor/jquery/jquery.min.js"></script>
<script src="../../vendor/layui/layui.js"></script>
<script>
(function() {
    var BASE_API = '../../';
    function apiUrl(path) {
        return BASE_API + path.replace(/^\/+/, '');
    }

    // 获取 URL 参数
    function getQueryParam(name) {
        var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)", "i");
        var r = window.location.search.substr(1).match(reg);
        if (r != null) return decodeURIComponent(r[2]);
        return null;
    }

    var userId = getQueryParam('id');
    var groupList = [];

    layui.use(['form', 'layer'], function() {
        var form = layui.form;
        var layer = layui.layer;

        function getToken() {
            return localStorage.getItem('admin_token') || '';
        }

        function ajax(opts) {
            return $.ajax({
                url: opts.url,
                type: opts.type || 'GET',
                data: opts.data || {},
                dataType: 'json',
                beforeSend: function(xhr) {
                    var t = getToken();
                    if (t) xhr.setRequestHeader('Admin-Token', t);
                },
                success: function(res) {
                    if (res.code === 401) {
                        localStorage.removeItem('admin_token');
                        localStorage.removeItem('admin_user');
                        parent.location.href = 'login.html';
                        return;
                    }
                    opts.success && opts.success(res);
                },
                error: function() {
                    layer.msg('请求失败', { icon: 2 });
                    opts.error && opts.error();
                }
            });
        }

        function renderUserGroupOptions(selectedId) {
            var html = '<option value="">未分组</option>';
            groupList.forEach(function(item) {
                html += '<option value="' + item.id + '">' + (item.display_name || item.name) + '</option>';
            });
            $('#userGroupId').html(html);
            if (selectedId !== undefined && selectedId !== null && selectedId !== '') {
                $('#userGroupId').val(String(selectedId));
            }
            form.render('select');
        }

        function loadUserGroups(selectedId) {
            ajax({
                url: apiUrl('user/groups'),
                success: function(res) {
                    if (res.code === 200) {
                        groupList = res.data || [];
                        renderUserGroupOptions(selectedId);
                    }
                }
            });
        }

        function refreshUserTable() {
            var frame = parent.document.getElementById('iframe-user-list');
            if (frame && frame.contentWindow && frame.contentWindow.refreshTable) {
                frame.contentWindow.refreshTable();
            }
        }

        $('#btnCancel').on('click', function() {
            parent.layer.close(parent.layer.getFrameIndex(window.name));
        });

        // 加载已有数据
        if (userId) {
            $('#username').attr('readonly', true).addClass('layui-disabled').css('background', '#f5f5f5');
            $('#password').attr('placeholder', '留空则不修改密码');
            $('#passwordHint').text('编辑学员留空则不修改密码');
            ajax({
                url: apiUrl('user/' + userId),
                success: function(res) {
                    if (res.code === 200) {
                        var d = res.data;
                        form.val('userForm', {
                            id: d.id,
                            username: d.username,
                            realname: d.realname || '',
                            phone: d.phone || '',
                            gender: d.gender || 0,
                            company: d.company || '',
                            department: d.department || '',
                            status: d.status === 1
                        });
                        loadUserGroups(d.user_group_id || '');
                        form.render();
                    } else {
                        parent.showError ? parent.showError(res.msg) : layer.msg(res.msg, { icon: 2 });
                    }
                }
            });
        } else {
            loadUserGroups();
        }

        // 提交表单
        form.on('submit(submitBtn)', function(data) {
            var url = userId ? apiUrl('user/' + userId) : apiUrl('user');
            var type = userId ? 'PUT' : 'POST';
            var postData = $.extend({}, data.field);
            postData.status = data.field.status ? '1' : '0';
            if (!postData.user_group_id) {
                postData.user_group_id = '';
            }
            if (!postData.password) {
                delete postData.password;
            }

            ajax({
                url: url,
                type: type,
                data: postData,
                success: function(res) {
                    if (res.code === 200) {
                        var msg = userId ? '更新成功' : '添加成功';
                        parent.showSuccess ? parent.showSuccess(msg) : layer.msg(msg, { icon: 1 });
                        parent.layer.close(parent.layer.getFrameIndex(window.name));
                        refreshUserTable();
                    } else {
                        (parent.showError ? parent.showError(res.msg) : null) || layer.msg(res.msg, { icon: 2 });
                    }
                }
            });
            return false;
        });
    });
})();
</script>
</body>
</html>
