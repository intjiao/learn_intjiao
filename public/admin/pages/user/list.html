<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学员管理</title>
    <link rel="stylesheet" href="../../vendor/layui/layui.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { padding: 0; background: #f0f2f5; }
        .search-bar { padding: 14px 16px 0; background: #fff; border-bottom: 1px solid #eee; }
        .toolbar { padding: 12px 16px; background: #fff; border-bottom: 1px solid #eee; }
        .toolbar .layui-btn { margin-right: 8px; }
        .search-bar .layui-form-item { margin-bottom: 0; }
        .layui-table-view { margin: 0; border: none; border-radius: 0; }
    </style>
</head>
<body>

<div class="search-bar">
    <form class="layui-form" lay-filter="searchForm">
        <div class="layui-form-item" style="margin-bottom:10px;">
            <div class="layui-inline">
                <label class="layui-form-label">关键词</label>
                <div class="layui-input-inline" style="width:150px;">
                    <input type="text" name="keyword" placeholder="姓名/用户名/手机" class="layui-input" autocomplete="off">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">状态</label>
                <div class="layui-input-inline" style="width:110px;">
                    <select name="status">
                        <option value="">全部</option>
                        <option value="1">正常</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <button class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="searchBtn"><i class="layui-icon layui-icon-search"></i> 查询</button>
                <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">重置</button>
            </div>
        </div>
    </form>
</div>

<div class="toolbar">
    <button class="layui-btn layui-btn-sm" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i> 添加学员</button>
    <button class="layui-btn layui-btn-sm layui-btn-warm" id="btnExport"><i class="layui-icon layui-icon-export"></i> 导出</button>
</div>

<table id="userTable" lay-filter="userTable"></table>

<script type="text/html" id="statusTpl">
    <input type="checkbox" name="status" value="{{d.id}}" lay-skin="switch" lay-text="正常|禁用" lay-filter="statusSwitch" {{d.status==1?'checked':''}}>
</script>

<script type="text/html" id="actionBar">
    <a class="layui-btn layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i> 编辑</a>
    <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="study">学时明细</a>
    <a class="layui-btn layui-btn-warm layui-btn-xs" lay-event="score">成绩明细</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i> 删除</a>
</script>

<script src="../../vendor/jquery/jquery.min.js"></script>
<script src="../../vendor/layui/layui.js"></script>
<script>
(function() {
    var BASE_API = '../../';
    function apiUrl(path) {
        return BASE_API + path.replace(/^\/+/, '');
    }
    var TABLE_ID = 'userTable';

    layui.use(['table', 'form', 'layer'], function() {
        var table = layui.table;
        var form = layui.form;
        var layer = layui.layer;

        // ========== 工具函数 ==========
        function getToken() {
            return localStorage.getItem('admin_token') || '';
        }

        function ajax(opts) {
            return $.ajax({
                url: opts.url,
                type: opts.type || 'GET',
                data: opts.data || {},
                dataType: 'json',
                beforeSend: function(xhr) {
                    var t = getToken();
                    if (t) xhr.setRequestHeader('Admin-Token', t);
                },
                success: function(res) {
                    if (res.code === 401) {
                        localStorage.removeItem('admin_token');
                        localStorage.removeItem('admin_user');
                        parent.location.href = 'login.html';
                        return;
                    }
                    opts.success && opts.success(res);
                },
                error: function() {
                    layer.msg('网络请求失败', { icon: 2 });
                    opts.error && opts.error();
                }
            });
        }

        function showSuccess(msg) { layer.msg(msg, { icon: 1, shade: 0.3, time: 1500 }); }
        function showError(msg) { layer.msg(msg, { icon: 2, shade: 0.3, time: 2000 }); }

        function openForm(title, url, w, h) {
            w = w || 700; h = h || 550;
            parent.layer.open({
                type: 2, title: title,
                area: [w + 'px', h + 'px'],
                fix: false, maxmin: true,
                shadeClose: false, shade: 0.4,
                content: url, zIndex: parent.layer.zIndex
            });
        }

        function deleteItem(url, id) {
            var msg = id ? '确定删除ID为【' + id + '】的数据吗？' : '确定删除选中的数据吗？';
            layer.confirm(msg, function(idx) {
                ajax({
                    url: url, type: 'DELETE',
                    success: function(res) {
                        if (res.code === 200) {
                            showSuccess('删除成功');
                            table.reload(TABLE_ID);
                        } else {
                            showError(res.msg || '删除失败');
                        }
                    }
                });
                layer.close(idx);
            });
        }

        // ========== 表格渲染 ==========
        table.render({
            elem: '#userTable',
            url: apiUrl('user/list'),
            page: true,
            limit: 15,
            limits: [10, 15, 20, 30, 50],
            headers: { 'Admin-Token': getToken() },
            response: { statusCode: 200 },
            request: { pageName: 'page', limitName: 'limit' },
            cols: [[
                { type: 'checkbox', fixed: 'left' },
                { field: 'id', title: 'ID', width: 70 },
                { field: 'username', title: '用户名', width: 120 },
                { field: 'realname', title: '姓名', width: 100 },
                { field: 'phone', title: '手机号', width: 130 },
                { field: 'gender_text', title: '性别', width: 60 },
                { field: 'company', title: '公司', minWidth: 140 },
                { field: 'group_name', title: '用户组', width: 100 },
                { field: 'status', title: '状态', width: 80, toolbar: '#statusTpl' },
                { field: 'last_login_time', title: '最后登录时间', width: 170, templet: function(d) {
                    return d.last_login_time ? d.last_login_time.replace('T', ' ').substring(0, 19) : '-';
                }},
                { field: 'created_at', title: '注册时间', width: 170, templet: function(d) {
                    return d.created_at ? d.created_at.replace('T', ' ').substring(0, 19) : '';
                }},
                { fixed: 'right', title: '操作', width: 360, toolbar: '#actionBar' }
            ]]
        });

        // ========== 搜索 ==========
        form.on('submit(searchBtn)', function(data) {
            table.reload(TABLE_ID, { where: data.field, page: { curr: 1 } });
            return false;
        });

        // ========== 状态切换 ==========
        form.on('switch(statusSwitch)', function(obj) {
            var id = this.value;
            var status = obj.elem.checked ? 1 : 0;
            ajax({
                url: apiUrl('user/' + id), type: 'PUT',
                data: { status: status },
                success: function(res) {
                    if (res.code !== 200) {
                        obj.elem.checked = !obj.elem.checked;
                        form.render('checkbox');
                        showError(res.msg);
                    }
                },
                error: function() {
                    obj.elem.checked = !obj.elem.checked;
                    form.render('checkbox');
                    showError('请求失败');
                }
            });
        });

        // ========== 行工具栏 ==========
        table.on('tool(userTable)', function(obj) {
            var data = obj.data;
            if (obj.event === 'edit') {
                openForm('编辑学员', 'pages/user/form.html?id=' + data.id, 700, 550);
            } else if (obj.event === 'study') {
                openForm((data.realname || data.username || '学员') + ' - 学时明细', 'pages/user/study_records.html?id=' + data.id, 980, 640);
            } else if (obj.event === 'score') {
                openForm((data.realname || data.username || '学员') + ' - 成绩明细', 'pages/user/exam_records.html?id=' + data.id, 1080, 660);
            } else if (obj.event === 'del') {
                deleteItem(apiUrl('user/' + data.id), data.id);
            }
        });

        // ========== 添删按钮 ==========
        $('#btnAdd').on('click', function() {
            openForm('添加学员', 'pages/user/form.html', 700, 550);
        });

        $('#btnExport').on('click', function() {
            var params = $('form[lay-filter=searchForm]').serialize();
            window.open(apiUrl('user/export') + '?' + params);
        });

        // ========== 暴露刷新方法给父窗口 ==========
        window.refreshTable = function() {
            table.reload(TABLE_ID);
        };
    });
})();
</script>
</body>
</html>
