<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>课程管理</title>
  <link rel="stylesheet" href="../../vendor/layui/layui.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f7fa; }
    .search-bar { padding: 14px 16px 0; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .search-bar .layui-form-item { margin-bottom: 12px; }
    .search-bar .layui-form-label {
      width: 78px !important;
      padding-right: 10px;
      white-space: nowrap;
      word-break: keep-all;
      overflow: visible;
      text-align: right;
    }
    .toolbar { padding: 12px 16px; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .data-table { background: #fff; }
    .layui-table-view { border: none; }
    .layui-table-box { background: #fff; }
  </style>
</head>
<body>
  <div class="search-bar">
    <form class="layui-form" lay-filter="searchForm">
      <div class="layui-form-item" style="margin-bottom: 10px;">
        <div class="layui-inline">
          <label class="layui-form-label" style="width: 70px;">关键词</label>
          <div class="layui-input-inline">
            <input type="text" name="keyword" placeholder="课程标题" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="width: 70px;">分类</label>
          <div class="layui-input-inline">
            <select name="category_id" id="categorySelect">
              <option value="">全部</option>
            </select>
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="width: 70px;">状态</label>
          <div class="layui-input-inline">
            <select name="status">
              <option value="">全部</option>
              <option value="1">上架</option>
              <option value="0">下架</option>
            </select>
          </div>
        </div>
        <div class="layui-inline">
          <button class="layui-btn layui-btn-normal" lay-submit lay-filter="searchBtn"><i class="layui-icon layui-icon-search"></i> 查询</button>
          <button type="reset" class="layui-btn layui-btn-primary">重置</button>
        </div>
      </div>
    </form>
  </div>

  <div class="toolbar">
    <button class="layui-btn layui-btn-sm" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i> 添加课程</button>
    <button class="layui-btn layui-btn-sm layui-btn-warm" id="btnExport"><i class="layui-icon layui-icon-export"></i> 导出</button>
  </div>

  <div class="data-table">
    <table id="courseTable" lay-filter="courseTable"></table>
  </div>

  <script type="text/html" id="coverTpl">
    {{# if(d.cover) { }}
    <img src="{{d.cover}}" style="width:60px;height:36px;border-radius:4px;object-fit:cover;" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2236%22%3E%3Crect fill=%22%23f0f0f0%22 width=%2260%22 height=%2236%22/%3E%3Ctext x=%2230%22 y=%2222%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2210%22%3E%E6%97%A0%E5%B0%81%E9%9D%A2%3C/text%3E%3C/svg%3E'">
    {{# } else { }}
    <span style="color:#999;">无</span>
    {{# } }}
  </script>

  <script type="text/html" id="statusTpl">
    {{# if(d.status == 1) { }}
    <span style="color:#43e97b;">上架</span>
    {{# } else { }}
    <span style="color:#999;">下架</span>
    {{# } }}
  </script>

  <script type="text/html" id="priceTpl">
    {{# if(d.is_free == 1) { }}
    <span style="color:#43e97b;">免费</span>
    {{# } else { }}
    <span>¥{{d.price}}</span>
    {{# } }}
  </script>

  <script type="text/html" id="actionBar">
    <a class="layui-btn layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i> 编辑</a>
    <a class="layui-btn layui-btn-xs" lay-event="chapters"><i class="layui-icon layui-icon-tabs"></i> 章节</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i> 删除</a>
  </script>

  <script src="../../vendor/jquery/jquery.min.js"></script>
  <script src="../../vendor/layui/layui.js"></script>
  <script>
  (function() {
    var BASE_API = '../../';
    function apiUrl(path) {
      return BASE_API + path.replace(/^\/+/, '');
    }
    var TABLE_ID = 'courseTable';
    var formInstance = null;

    function getToken() {
      return localStorage.getItem('admin_token') || '';
    }

    function ajax(opts) {
      return $.ajax({
        url: opts.url,
        type: opts.type || 'GET',
        data: opts.data || {},
        dataType: 'json',
        beforeSend: function(xhr) {
          var t = getToken();
          if (t) xhr.setRequestHeader('Admin-Token', t);
        },
        success: function(res) {
          if (res.code === 401) {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
            parent.location.href = 'login.html';
            return;
          }
          opts.success && opts.success(res);
        },
        error: function() {
          layer.msg('网络请求失败', { icon: 2 });
          opts.error && opts.error();
        }
      });
    }

    function showSuccess(msg) { layer.msg(msg, { icon: 1, shade: 0.3, time: 1500 }); }
    function showError(msg) { layer.msg(msg, { icon: 2, shade: 0.3, time: 2000 }); }

    function openForm(title, url, w, h) {
      w = w || 900; h = h || 600;
      parent.layer.open({
        type: 2,
        title: title,
        area: [w + 'px', h + 'px'],
        fix: false,
        maxmin: true,
        shadeClose: false,
        shade: 0.4,
        content: url,
        zIndex: parent.layer.zIndex
      });
    }

    function deleteItem(url, id) {
      var msg = id ? '确定删除ID为【' + id + '】的数据吗？' : '确定删除选中的数据吗？';
      layer.confirm(msg, function(idx) {
        ajax({
          url: url,
          type: 'DELETE',
          success: function(res) {
            if (res.code === 200) {
              showSuccess('删除成功');
              table.reload(TABLE_ID);
            } else {
              showError(res.msg || '删除失败');
            }
          }
        });
        layer.close(idx);
      });
    }

    var table;

    layui.use(['table', 'form', 'layer'], function() {
      table = layui.table;
      var form = layui.form;
      formInstance = form;

      loadCategories();

      table.render({
        elem: '#' + TABLE_ID,
        url: apiUrl('course/list'),
        page: true,
        limit: 15,
        limits: [10, 15, 20, 30, 50],
        headers: { 'Admin-Token': getToken() },
        response: { statusCode: 200 },
        request: { pageName: 'page', limitName: 'limit' },
        cols: [[
          { type: 'checkbox', fixed: 'left' },
          { field: 'id', title: 'ID', width: 80 },
          { field: 'cover', title: '封面', width: 90, toolbar: '#coverTpl' },
          { field: 'title', title: '课程标题', minWidth: 200 },
          { field: 'teacher', title: '讲师', width: 100 },
          { field: 'category_name', title: '分类', width: 120 },
          { field: 'chapter_count', title: '章节', width: 80 },
          { field: 'total_duration', title: '时长', width: 90, templet: function(d) {
            var s = parseInt(d.total_duration) || 0;
            var h = Math.floor(s / 3600);
            var m = Math.floor((s % 3600) / 60);
            return h > 0 ? h + 'h ' + m + 'm' : m + 'm';
          }},
          { field: 'student_count', title: '学员', width: 80 },
          { field: 'price', title: '费用', width: 90, toolbar: '#priceTpl' },
          { field: 'status', title: '状态', width: 80, toolbar: '#statusTpl' },
          { fixed: 'right', title: '操作', width: 220, toolbar: '#actionBar' }
        ]]
      });

      form.on('submit(searchBtn)', function(data) {
        table.reload(TABLE_ID, { where: data.field, page: { curr: 1 } });
        return false;
      });

      table.on('tool(' + TABLE_ID + ')', function(obj) {
        var data = obj.data;
        var event = obj.event;
        if (event === 'edit') {
          openForm('编辑课程', 'pages/course/form.html?id=' + data.id, 900, 600);
        } else if (event === 'chapters') {
          openForm('课程章节', 'pages/course/chapters.html?course_id=' + data.id, 800, 600);
        } else if (event === 'del') {
          deleteItem(apiUrl('course/' + data.id), data.id);
        }
      });

      $('#btnAdd').on('click', function() {
        openForm('添加课程', 'pages/course/form.html', 900, 600);
      });

      $('#btnExport').on('click', function() {
        var params = $('form[lay-filter=searchForm]').serialize();
        window.open(apiUrl('course/export') + '?' + params);
      });

      window.refreshTable = function() {
        table.reload(TABLE_ID);
      };
    });

    function loadCategories() {
      ajax({
        url: apiUrl('category/tree'),
        data: { type: 'course' },
        success: function(res) {
          if (res.code === 200 && res.data) {
            var html = '<option value="">全部</option>';
            res.data.forEach(function(item) {
              html += '<option value="' + item.id + '">' + item.name + '</option>';
            });
            $('#categorySelect').html(html);
            if (formInstance) formInstance.render('select');
          }
        }
      });
    }
  })();
  </script>
</body>
</html>
