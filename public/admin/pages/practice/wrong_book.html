<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>纠错本</title>
  <link rel="stylesheet" href="../../vendor/layui/layui.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f7fa; }
    .top-bar { padding: 14px 16px 0; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .top-bar .layui-form-label {
      width: 78px !important;
      padding-right: 10px;
      white-space: nowrap;
      word-break: keep-all;
      overflow: visible;
      text-align: right;
    }
    .toolbar { padding: 12px 16px; background: #fff; border-bottom: 1px solid #f0f0f0; display: flex; gap: 8px; flex-wrap: wrap; }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 16px; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .stat-card { background: #f8f9fb; border-radius: 10px; padding: 16px; }
    .stat-num { font-size: 28px; font-weight: 700; color: #1890ff; }
    .stat-label { font-size: 13px; color: #888; margin-top: 4px; }
    .data-table { background: #fff; }
    .layui-table-view { border: none; }
    @media (max-width: 768px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <form class="layui-form" lay-filter="searchForm">
      <div class="layui-form-item" style="margin-bottom: 10px;">
        <div class="layui-inline">
          <label class="layui-form-label" style="width: 70px;">关键词</label>
          <div class="layui-input-inline">
            <input type="text" name="keyword" placeholder="题干关键字" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="width: 70px;">分类</label>
          <div class="layui-input-inline">
            <select name="category_id" id="categorySelect">
              <option value="">全部</option>
            </select>
          </div>
        </div>
        <div class="layui-inline">
          <button class="layui-btn layui-btn-normal" lay-submit lay-filter="searchBtn"><i class="layui-icon layui-icon-search"></i> 查询</button>
          <button type="reset" class="layui-btn layui-btn-primary">重置</button>
        </div>
      </div>
    </form>
  </div>

  <div class="toolbar">
    <button class="layui-btn layui-btn-sm" id="btnQuestionBank"><i class="layui-icon layui-icon-survey"></i> 题库管理</button>
    <button class="layui-btn layui-btn-sm layui-btn-normal" id="btnChapterCategory"><i class="layui-icon layui-icon-template-1"></i> 章节分类</button>
    <button class="layui-btn layui-btn-sm layui-btn-warm" id="btnRefresh"><i class="layui-icon layui-icon-refresh"></i> 刷新</button>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="stat-num" id="statQuestionTotal">0</div><div class="stat-label">启用题目</div></div>
    <div class="stat-card"><div class="stat-num" id="statCategoryTotal">0</div><div class="stat-label">章节分类</div></div>
    <div class="stat-card"><div class="stat-num" id="statPracticeTotal">0</div><div class="stat-label">练习次数</div></div>
    <div class="stat-card"><div class="stat-num" id="statWrongTotal">0</div><div class="stat-label">错题次数</div></div>
  </div>

  <div class="data-table">
    <table id="wrongBookTable" lay-filter="wrongBookTable"></table>
  </div>

  <script type="text/html" id="typeTpl">
    {{# var typeMap = {1:'单选题',2:'多选题',3:'填空题',4:'判断题',5:'问答题'}; }}
    <span class="layui-badge layui-bg-blue">{{ typeMap[d.type] || d.type }}</span>
  </script>

  <script type="text/html" id="actionTpl">
    <a class="layui-btn layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i> 查看题目</a>
  </script>

  <script src="../../vendor/jquery/jquery.min.js"></script>
  <script src="../../vendor/layui/layui.js"></script>
  <script>
  (function() {
    var BASE_API = '../../';
    var TABLE_ID = 'wrongBookTable';

    function apiUrl(path) {
      return BASE_API + path.replace(/^\/+/, '');
    }

    function getToken() {
      return localStorage.getItem('admin_token') || '';
    }

    function ajax(opts) {
      return $.ajax({
        url: opts.url,
        type: opts.type || 'GET',
        data: opts.data || {},
        dataType: 'json',
        beforeSend: function(xhr) {
          var t = getToken();
          if (t) xhr.setRequestHeader('Admin-Token', t);
        },
        success: function(res) {
          if (res.code === 401) {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
            parent.location.href = 'login.html';
            return;
          }
          opts.success && opts.success(res);
        },
        error: function() {
          layer.msg('网络请求失败', { icon: 2 });
          opts.error && opts.error();
        }
      });
    }

    function loadStats() {
      ajax({
        url: apiUrl('practice/stats'),
        success: function(res) {
          if (res.code === 200 && res.data) {
            $('#statQuestionTotal').text(res.data.question_total || 0);
            $('#statCategoryTotal').text(res.data.category_total || 0);
            $('#statPracticeTotal').text(res.data.practice_total || 0);
            $('#statWrongTotal').text(res.data.wrong_total || 0);
          }
        }
      });
    }

    function renderCategoryOptions() {
      ajax({
        url: apiUrl('category/tree'),
        data: { type: 'question' },
        success: function(res) {
          if (res.code !== 200) return;
          var options = '<option value="">全部</option>';
          function walk(items, prefix) {
            items.forEach(function(item) {
              options += '<option value="' + item.id + '">' + prefix + item.name + '</option>';
              if (item.children && item.children.length) {
                walk(item.children, prefix + '　');
              }
            });
          }
          walk(res.data || [], '');
          $('#categorySelect').html(options);
          layui.form.render('select');
        }
      });
    }

    layui.use(['table', 'form', 'layer'], function() {
      var table = layui.table;
      var form = layui.form;

      table.render({
        elem: '#' + TABLE_ID,
        url: apiUrl('practice/wrong-book'),
        page: true,
        limit: 15,
        limits: [10, 15, 20, 30, 50],
        headers: { 'Admin-Token': getToken() },
        response: { statusCode: 200 },
        request: { pageName: 'page', limitName: 'limit' },
        cols: [[
          { type: 'numbers', title: '序号', width: 70 },
          { field: 'question_id', title: '题目ID', width: 90 },
          { field: 'type', title: '题型', width: 110, toolbar: '#typeTpl' },
          { field: 'category_name', title: '分类', width: 140 },
          { field: 'stem', title: '题干', minWidth: 280, templet: function(d) {
            return '<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="' + d.stem + '">' + d.stem + '</div>';
          }},
          { field: 'wrong_count', title: '错题次数', width: 100 },
          { field: 'user_count', title: '涉及人数', width: 100 },
          { field: 'latest_wrong_at', title: '最近错误', width: 180, templet: function(d) {
            return d.latest_wrong_at ? String(d.latest_wrong_at).replace('T', ' ').substring(0, 19) : '-';
          }},
          { fixed: 'right', title: '操作', width: 140, toolbar: '#actionTpl' }
        ]]
      });

      loadStats();
      renderCategoryOptions();

      form.on('submit(searchBtn)', function(data) {
        table.reload(TABLE_ID, { where: data.field, page: { curr: 1 } });
        return false;
      });

      table.on('tool(' + TABLE_ID + ')', function(obj) {
        if (obj.event === 'edit') {
          parent.layer.open({
            type: 2,
            title: '查看题目',
            area: ['980px', '720px'],
            fix: false,
            maxmin: true,
            shadeClose: false,
            shade: 0.4,
            content: new URL('../question/form.html?id=' + obj.data.question_id, window.location.href).toString(),
            zIndex: parent.layer.zIndex
          });
        }
      });

      $('#btnQuestionBank').on('click', function() {
        location.href = '../question/list.html';
      });

      $('#btnChapterCategory').on('click', function() {
        location.href = '../system/category.html?type=question';
      });

      $('#btnRefresh').on('click', function() {
        loadStats();
        table.reload(TABLE_ID);
      });

      window.refreshTable = function() {
        loadStats();
        table.reload(TABLE_ID);
      };
    });
  })();
  </script>
</body>
</html>
