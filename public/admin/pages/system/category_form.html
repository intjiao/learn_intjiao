<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>分类表单</title>
  <link rel="stylesheet" href="../../vendor/layui/layui.css">
  <link rel="stylesheet" href="../../css/admin.css">
  <style>body { padding: 20px; background: #fff; }</style>
</head>
<body class="admin-embedded-page">
<div class="admin-form-shell">
<form class="layui-form" lay-filter="mainForm" style="max-width:700px;">
  <div class="layui-form-item">
    <label class="layui-form-label">分类名称</label>
    <div class="layui-input-block">
      <input type="text" name="name" class="layui-input" lay-verify="required" placeholder="请输入分类名称">
    </div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label">分类类型</label>
    <div class="layui-input-block">
      <select name="type" id="selType" lay-filter="typeSelect" lay-verify="required">
        <option value="">请选择类型</option>
        <option value="question">试题分类</option>
        <option value="course">课程分类</option>
        <option value="knowledge">知识分类</option>
        <option value="task">任务分类</option>
      </select>
    </div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label">上级分类</label>
    <div class="layui-input-block">
      <select name="parent_id" id="selParent" lay-search>
        <option value="0">作为顶级分类</option>
      </select>
    </div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label">排序</label>
    <div class="layui-input-block">
      <input type="number" name="sort" value="0" class="layui-input" style="width:200px;" min="0">
    </div>
  </div>
  <div class="layui-form-item">
    <label class="layui-form-label">状态</label>
    <div class="layui-input-block">
      <input type="checkbox" name="status" value="1" lay-skin="switch" lay-text="启用|禁用" checked>
    </div>
  </div>
  <div class="layui-form-item">
    <div class="layui-input-block">
      <button class="layui-btn" lay-submit lay-filter="submitBtn">保存</button>
      <button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
    </div>
  </div>
</form>
</div>
<script src="../../vendor/jquery/jquery.min.js"></script>
<script src="../../vendor/layui/layui.js"></script>
<script>
(function() {
  var BASE_API = '../../';
  var id = null;
  var currentType = '';

  function getQueryParam(name) {
    var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)", "i");
    var r = window.location.search.substr(1).match(reg);
    if (r != null) return decodeURIComponent(r[2]);
    return null;
  }

  function getToken() {
    return localStorage.getItem('admin_token') || '';
  }

  function ajax(opts) {
    return $.ajax({
      url: opts.url,
      type: opts.type || 'GET',
      data: opts.data || {},
      dataType: 'json',
      beforeSend: function(xhr) {
        var t = getToken();
        if (t) xhr.setRequestHeader('Admin-Token', t);
      },
      success: function(res) {
        if (res.code === 401) {
          localStorage.removeItem('admin_token');
          localStorage.removeItem('admin_user');
          parent.location.href = 'login.html';
          return;
        }
        opts.success && opts.success(res);
      },
      error: function() {
        layer.msg('请求失败', { icon: 2 });
        opts.error && opts.error();
      }
    });
  }

  function loadParentCategories(type) {
    ajax({
      url: BASE_API + 'category/tree?type=' + type,
      success: function(res) {
        if (res.code === 200) {
          buildParentOptions(res.data, '');
          form.render('select');
        }
      }
    });
  }

  function buildParentOptions(data, prefix) {
    var sel = document.getElementById('selParent');
    var currentVal = $('select[name="parent_id"]').val();
    sel.innerHTML = '<option value="0">作为顶级分类</option>';
    data.forEach(function(item) {
      if (String(item.id) !== String(id)) {
        var opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = prefix + item.name;
        sel.appendChild(opt);
        if (item.children && item.children.length > 0) {
          buildParentOptions(item.children, prefix + '　');
        }
      }
    });
    if (currentVal) {
      $('select[name="parent_id"]').val(currentVal);
    }
  }

  layui.use(['form', 'layer'], function() {
    var form = layui.form;
    var layer = layui.layer;

    id = getQueryParam('id');

    form.on('select(typeSelect)', function(data) {
      currentType = data.value;
      if (currentType) {
        loadParentCategories(currentType);
      }
    });

    if (id) {
      ajax({
        url: BASE_API + 'category/' + id,
        success: function(res) {
          if (res.code === 200) {
            var d = res.data;
            currentType = d.type || '';
            form.val('mainForm', {
              'name': d.name,
              'type': d.type,
              'parent_id': d.parent_id,
              'sort': d.sort,
              'status': d.status == 1
            });
            form.render();
            if (currentType) {
              loadParentCategories(currentType);
            }
          }
        }
      });
    }

    $('#btnCancel').on('click', function() {
      parent.layer.close(parent.layer.getFrameIndex(window.name));
    });

    form.on('submit(submitBtn)', function(formData) {
      var data = formData.field;
      data.status = (data.status === 'on' || data.status === '1') ? 1 : 0;
      if (!data.parent_id) data.parent_id = 0;

      var url = id ? BASE_API + 'category/' + id : BASE_API + 'category';
      var type = id ? 'PUT' : 'POST';

      ajax({
        url: url,
        type: type,
        data: data,
        success: function(res) {
          if (res.code === 200) {
            parent.showSuccess ? parent.showSuccess(id ? '更新成功' : '添加成功') : layer.msg(id ? '更新成功' : '添加成功', { icon: 1 });
            parent.layer.close(parent.layer.getFrameIndex(window.name));
            if (parent.refreshTable) parent.refreshTable();
          } else {
            if (parent.showError) parent.showError(res.msg);
            else layer.msg(res.msg, { icon: 2 });
          }
        }
      });
      return false;
    });
  });
})();
</script>
</body>
</html>
