<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>考试详情</title>
  <link rel="stylesheet" href="../../vendor/layui/layui.css">
  <style>
    body { padding: 20px; background: #fff; }
    .detail-section { margin-bottom: 25px; }
    .detail-title { font-size: 16px; font-weight: bold; border-bottom: 2px solid #009688; padding-bottom: 8px; margin-bottom: 15px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .detail-item { display: flex; line-height: 1.8; }
    .detail-label { font-weight: bold; color: #666; width: 100px; flex-shrink: 0; }
    .detail-value { color: #333; }
    .pass-badge { display: inline-block; padding: 2px 10px; border-radius: 3px; font-size: 13px; }
    .pass-yes { background: #52c41a; color: #fff; }
    .pass-no { background: #ff4d4f; color: #fff; }
    .info-card { background: #f5f5f5; padding: 15px; border-radius: 4px; }
  </style>
</head>
<body>
<div id="detailContent">
  <div class="detail-section">
    <div class="detail-title">学员信息</div>
    <div class="info-card">
      <div class="detail-grid">
        <div class="detail-item"><span class="detail-label">姓名：</span><span class="detail-value" id="realname"></span></div>
        <div class="detail-item"><span class="detail-label">用户名：</span><span class="detail-value" id="username"></span></div>
        <div class="detail-item"><span class="detail-label">手机号：</span><span class="detail-value" id="phone"></span></div>
        <div class="detail-item"><span class="detail-label">部门：</span><span class="detail-value" id="department"></span></div>
      </div>
    </div>
  </div>

  <div class="detail-section">
    <div class="detail-title">考试信息</div>
    <div class="info-card">
      <div class="detail-grid">
        <div class="detail-item"><span class="detail-label">试卷名称：</span><span class="detail-value" id="paper_title"></span></div>
        <div class="detail-item"><span class="detail-label">考试时间：</span><span class="detail-value" id="exam_time"></span></div>
        <div class="detail-item"><span class="detail-label">用时：</span><span class="detail-value" id="duration_used"></span></div>
        <div class="detail-item"><span class="detail-label">提交时间：</span><span class="detail-value" id="submit_time"></span></div>
      </div>
    </div>
  </div>

  <div class="detail-section">
    <div class="detail-title">成绩</div>
    <div class="info-card">
      <div class="detail-grid">
        <div class="detail-item"><span class="detail-label">得分：</span><span class="detail-value" id="score" style="font-size:20px;color:#009688;font-weight:bold;"></span></div>
        <div class="detail-item"><span class="detail-label">总分：</span><span class="detail-value" id="total_score"></span></div>
        <div class="detail-item"><span class="detail-label">及格分：</span><span class="detail-value" id="pass_score"></span></div>
        <div class="detail-item"><span class="detail-label">通过状态：</span><span class="detail-value" id="pass_status"></span></div>
      </div>
    </div>
  </div>

  <div class="detail-section">
    <div class="detail-title">操作</div>
    <div class="layui-form" style="padding:10px 0;">
      <button class="layui-btn layui-btn-normal" id="btnViewAnswers">查看答卷</button>
      <button class="layui-btn layui-btn-primary" id="btnBack">返回</button>
    </div>
  </div>
</div>
<script src="../../vendor/jquery/jquery.min.js"></script>
<script src="../../vendor/layui/layui.js"></script>
<script>
(function() {
  var BASE_API = '../../';
  var examId = null;

  function getQueryParam(name) {
    var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)", "i");
    var r = window.location.search.substr(1).match(reg);
    if (r != null) return decodeURIComponent(r[2]);
    return null;
  }

  function getToken() {
    return localStorage.getItem('admin_token') || '';
  }

  function ajax(opts) {
    return $.ajax({
      url: opts.url,
      type: opts.type || 'GET',
      data: opts.data || {},
      dataType: 'json',
      beforeSend: function(xhr) {
        var t = getToken();
        if (t) xhr.setRequestHeader('Admin-Token', t);
      },
      success: function(res) {
        if (res.code === 401) {
          localStorage.removeItem('admin_token');
          localStorage.removeItem('admin_user');
          parent.location.href = 'login.html';
          return;
        }
        opts.success && opts.success(res);
      },
      error: function() {
        layer.msg('请求失败', { icon: 2 });
        opts.error && opts.error();
      }
    });
  }

  layui.use(['layer'], function() {
    var layer = layui.layer;

    examId = getQueryParam('id');

    if (!examId) {
      layer.msg('缺少考试ID', { icon: 2 });
      return;
    }

    ajax({
      url: BASE_API + 'exam/' + examId,
      success: function(res) {
        if (res.code === 200) {
          var d = res.data;
          document.getElementById('realname').textContent = d.realname || '-';
          document.getElementById('username').textContent = d.username || '-';
          document.getElementById('phone').textContent = d.phone || '-';
          document.getElementById('department').textContent = d.department || '-';
          document.getElementById('paper_title').textContent = d.paper_title || '-';
          document.getElementById('exam_time').textContent = d.exam_time || '-';
          var usedMin = parseInt(d.duration_used) || 0;
          document.getElementById('duration_used').textContent = usedMin + ' 分钟';
          document.getElementById('submit_time').textContent = d.submit_time || '-';
          document.getElementById('score').textContent = d.score !== undefined ? d.score : '-';
          document.getElementById('total_score').textContent = d.total_score || '-';
          document.getElementById('pass_score').textContent = d.pass_score || '-';

          var isPass = d.is_pass == 1 || d.score >= (d.pass_score || 60);
          var passEl = document.getElementById('pass_status');
          if (isPass) {
            passEl.innerHTML = '<span class="pass-badge pass-yes">通过</span>';
          } else {
            passEl.innerHTML = '<span class="pass-badge pass-no">未通过</span>';
          }
        } else {
          layer.msg(res.msg || '加载失败', { icon: 2 });
        }
      }
    });

    $('#btnViewAnswers').on('click', function() {
      layer.open({
        type: 2,
        title: '查看答卷',
        area: ['900px', '700px'],
        content: 'answers.html?id=' + examId
      });
    });

    $('#btnBack').on('click', function() {
      if (parent.layer) {
        parent.layer.close(parent.layer.getFrameIndex(window.name));
      }
    });
  });
})();
</script>
</body>
</html>
