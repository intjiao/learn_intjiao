<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>考试记录</title>
  <link rel="stylesheet" href="../../vendor/layui/layui.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f7fa; }
    .search-bar { padding: 14px 16px 0; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .search-bar .layui-form-item { margin-bottom: 12px; }
    .search-bar .layui-form-label {
      width: 78px !important;
      padding-right: 10px;
      white-space: nowrap;
      word-break: keep-all;
      overflow: visible;
      text-align: right;
    }
    .toolbar { padding: 12px 16px; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .data-table { background: #fff; }
    .layui-table-view { border: none; }
    .layui-table-box { background: #fff; }
  </style>
</head>
<body>
  <div class="search-bar">
    <form class="layui-form" lay-filter="searchForm">
      <div class="layui-form-item" style="margin-bottom: 10px;">
        <div class="layui-inline">
          <label class="layui-form-label" style="width: 70px;">关键词</label>
          <div class="layui-input-inline">
            <input type="text" name="keyword" placeholder="试卷/学员" class="layui-input">
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label" style="width: 70px;">状态</label>
          <div class="layui-input-inline">
            <select name="status">
              <option value="">全部</option>
              <option value="0">已取消</option>
              <option value="1">进行中</option>
              <option value="2">已完成</option>
            </select>
          </div>
        </div>
        <div class="layui-inline">
          <button class="layui-btn layui-btn-normal" lay-submit lay-filter="searchBtn"><i class="layui-icon layui-icon-search"></i> 查询</button>
          <button type="reset" class="layui-btn layui-btn-primary">重置</button>
        </div>
      </div>
    </form>
  </div>

  <div class="toolbar">
    <button class="layui-btn layui-btn-sm layui-btn-warm" id="btnExport"><i class="layui-icon layui-icon-export"></i> 导出</button>
    <button class="layui-btn layui-btn-sm" id="btnRefresh"><i class="layui-icon layui-icon-refresh"></i> 刷新</button>
  </div>

  <div class="data-table">
    <table id="examTable" lay-filter="examTable"></table>
  </div>

  <script type="text/html" id="statusTpl">
    {{# var map = {0:'<span style="color:#999;">已取消</span>', 1:'<span style="color:#FFB800;">进行中</span>', 2:'<span style="color:#1E9FFF;">已完成</span>'}; }}
    {{ map[d.status] }}
  </script>

  <script type="text/html" id="resultTpl">
    {{# if(d.status != 2) { }}
    <span style="color:#999;">-</span>
    {{# } else { }}
    {{# if(d.pass_status == 1) { }}
    <span style="color:#43e97b;">及格 {{d.score}}分</span>
    {{# } else { }}
    <span style="color:#fa709a;">不及格 {{d.score}}分</span>
    {{# } }}
    {{# } }}
  </script>

  <script type="text/html" id="durationTpl">
    {{# var s = parseInt(d.duration) || 0; }}
    {{ Math.floor(s / 60) }}分{{ s % 60 }}秒
  </script>

  <script type="text/html" id="actionBar">
    <a class="layui-btn layui-btn-xs" lay-event="detail"><i class="layui-icon layui-icon-about"></i> 详情</a>
    {{# if(d.status == 2) { }}
    <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="answers"><i class="layui-icon layui-icon-about"></i> 答卷</a>
    {{# } }}
  </script>

  <script src="../../vendor/jquery/jquery.min.js"></script>
  <script src="../../vendor/layui/layui.js"></script>
  <script>
  (function() {
    var BASE_API = '../../';
    function apiUrl(path) {
      return BASE_API + path.replace(/^\/+/, '');
    }
    var TABLE_ID = 'examTable';

    function getToken() {
      return localStorage.getItem('admin_token') || '';
    }

    function ajax(opts) {
      return $.ajax({
        url: opts.url,
        type: opts.type || 'GET',
        data: opts.data || {},
        dataType: 'json',
        beforeSend: function(xhr) {
          var t = getToken();
          if (t) xhr.setRequestHeader('Admin-Token', t);
        },
        success: function(res) {
          if (res.code === 401) {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
            parent.location.href = 'login.html';
            return;
          }
          opts.success && opts.success(res);
        },
        error: function() {
          layer.msg('网络请求失败', { icon: 2 });
          opts.error && opts.error();
        }
      });
    }

    function showSuccess(msg) { layer.msg(msg, { icon: 1, shade: 0.3, time: 1500 }); }
    function showError(msg) { layer.msg(msg, { icon: 2, shade: 0.3, time: 2000 }); }

    function openForm(title, url, w, h) {
      w = w || 800; h = h || 600;
      parent.layer.open({
        type: 2,
        title: title,
        area: [w + 'px', h + 'px'],
        fix: false,
        maxmin: true,
        shadeClose: false,
        shade: 0.4,
        content: url,
        zIndex: parent.layer.zIndex
      });
    }

    var table;

    layui.use(['table', 'form', 'layer'], function() {
      table = layui.table;
      var form = layui.form;

      table.render({
        elem: '#' + TABLE_ID,
        url: apiUrl('exam/list'),
        page: true,
        limit: 15,
        limits: [10, 15, 20, 30, 50],
        headers: { 'Admin-Token': getToken() },
        response: { statusCode: 200 },
        request: { pageName: 'page', limitName: 'limit' },
        cols: [[
          { type: 'checkbox', fixed: 'left' },
          { field: 'id', title: 'ID', width: 80 },
          { field: 'user_name', title: '学员', width: 120 },
          { field: 'user_phone', title: '手机号', width: 130 },
          { field: 'paper_title', title: '试卷', minWidth: 150 },
          { field: 'status', title: '状态', width: 100, toolbar: '#statusTpl' },
          { field: 'pass_status', title: '结果', width: 120, toolbar: '#resultTpl' },
          { field: 'duration', title: '用时', width: 100, toolbar: '#durationTpl' },
          { field: 'start_time', title: '开始时间', width: 180, templet: function(d) {
            return d.start_time ? d.start_time.replace('T', ' ').substring(0, 19) : '-';
          }},
          { fixed: 'right', title: '操作', width: 180, toolbar: '#actionBar' }
        ]]
      });

      form.on('submit(searchBtn)', function(data) {
        table.reload(TABLE_ID, { where: data.field, page: { curr: 1 } });
        return false;
      });

      table.on('tool(' + TABLE_ID + ')', function(obj) {
        var data = obj.data;
        var event = obj.event;
        if (event === 'detail') {
          openForm('考试详情', 'pages/exam/detail.html?id=' + data.id, 800, 600);
        } else if (event === 'answers') {
          openForm('答卷查看', 'pages/exam/answers.html?id=' + data.id, 900, 700);
        }
      });

      $('#btnExport').on('click', function() {
        var params = $('form[lay-filter=searchForm]').serialize();
        window.open(apiUrl('exam/export') + '?' + params);
      });

      $('#btnRefresh').on('click', function() {
        table.reload(TABLE_ID);
      });

      window.refreshTable = function() {
        table.reload(TABLE_ID);
      };
    });
  })();
  </script>
</body>
</html>
