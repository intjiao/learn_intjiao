<style>
.required { color: #FF5722; margin-right: 4px; }
</style>

<div class="form-panel" style="padding:20px;max-width:600px;">
    <form class="layui-form" lay-filter="chapterForm" id="chapterForm">
        <input type="hidden" name="id" id="chapterId">
        <input type="hidden" name="course_id" id="courseId">

        <div class="layui-form-item">
            <label class="layui-form-label"><span class="required">*</span>章节标题</label>
            <div class="layui-input-block">
                <input type="text" name="title" required lay-verify="required" placeholder="请输入章节标题" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">内容类型</label>
            <div class="layui-input-block">
                <select name="content_type" id="contentType">
                    <option value="video">视频</option>
                    <option value="document">文档</option>
                    <option value="audio">音频</option>
                </select>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">内容/链接</label>
            <div class="layui-input-block">
                <textarea name="content" placeholder="请输入内容或URL" class="layui-textarea" style="min-height:80px;"></textarea>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">时长(秒)</label>
            <div class="layui-input-block">
                <input type="number" name="duration" value="0" class="layui-input" style="width:120px;">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">排序</label>
            <div class="layui-input-block">
                <input type="number" name="sort" value="0" class="layui-input" style="width:100px;">
            </div>
        </div>
    </form>
</div>

<script>
var form;
var q = location.search;
var chapterId = null;
var courseId = null;
var m;
if (q) {
    m = q.match(/[?&]id=(\d+)/);
    if (m) chapterId = m[1];
    m = q.match(/[?&]course_id=(\d+)/);
    if (m) courseId = m[1];
}

function getQueryParam(name) {
    var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)", "i");
    var r = window.location.search.substr(1).match(reg);
    if (r != null) return decodeURIComponent(r[2]);
    return null;
}

layui.use(['form', 'layer'], function() {
    form = layui.form;
    var layer = layui.layer;

    if (courseId) $('#courseId').val(courseId);

    if (chapterId) {
        $.ajax({
            url: '../../chapter/' + chapterId,
            beforeSend: function(xhr) {
                var token = localStorage.getItem('admin_token');
                if (token) xhr.setRequestHeader('Admin-Token', token);
            },
            success: function(res) {
                if (res.code === 200) {
                    form.val('chapterForm', res.data);
                }
            }
        });
    }

    window.submitForm = function(callback) {
        var url = chapterId ? '../../chapter/' + chapterId : '../../course/' + courseId + '/chapter';
        var type = chapterId ? 'PUT' : 'POST';
        var data = form.val('chapterForm');
        $.ajax({
            url: url, type: type, data: data,
            beforeSend: function(xhr) {
                var token = localStorage.getItem('admin_token');
                if (token) xhr.setRequestHeader('Admin-Token', token);
            },
            success: function(res) {
                if (res.code === 200) {
                    parent.showSuccess(chapterId ? '更新成功' : '添加成功');
                    if (callback) callback();
                } else {
                    parent.showError(res.msg);
                }
            }
        });
    };
});
</script>
