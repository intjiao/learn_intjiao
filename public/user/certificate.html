<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的证书 - 在线培训考试系统</title>
    <link rel="stylesheet" href="https://unpkg.com/layui@2.9.23/dist/css/layui.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: #F5F7FA; }
        .page-header {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .page-header .back-btn { font-size: 18px; cursor: pointer; padding: 4px; }
        .page-header h1 { font-size: 17px; font-weight: 600; flex: 1; }
        .content { padding: 16px; }
        .cert-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 14px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            border-left: 4px solid #f1c40f;
            cursor: pointer;
        }
        .cert-card:active { background: #f8f9ff; }
        .cert-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            margin-bottom: 12px;
        }
        .cert-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .cert-info { font-size: 13px; color: #999; margin-bottom: 4px; }
        .cert-no { font-size: 12px; color: #bbb; font-family: monospace; margin-top: 8px; }
        .cert-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-top: 8px; }
        .cert-tag.valid { background: #E8F5E9; color: #43A047; }
        .cert-tag.expired { background: #FFEBEE; color: #F44336; }
        .empty-state { text-align: center; padding: 60px 20px; color: #c0c0c0; }
        .empty-state i { font-size: 48px; margin-bottom: 12px; display: block; }
    </style>
</head>
<body>
    <div class="page-header">
        <div class="back-btn" onclick="location.href='index.html'"><i class="layui-icon layui-icon-left"></i></div>
        <h1>我的证书</h1>
    </div>
    <div class="content" id="certList">
        <div class="empty-state"><i class="layui-icon layui-icon-loading-1"></i><p>加载中...</p></div>
    </div>
    <script src="https://unpkg.com/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://unpkg.com/layui@2.9.23/dist/layui.js"></script>
    <script src="api.js"></script>
    <script>
        if (!Api.checkLogin()) {}
        function loadCerts() {
            Api.getCertificateList(1, 50).then(function(res) {
                var el = document.getElementById('certList');
                if (res.code === 200 && res.data && res.data.length > 0) {
                    el.innerHTML = res.data.map(function(c) {
                        var isValid = !c.expire_date || c.expire_date >= new Date().toISOString().slice(0, 10);
                        return '<div class="cert-card" onclick="location.href=\'certificate-detail.html?id=' + c.id + '\'">'
                            + '<div class="cert-icon"><i class="layui-icon layui-icon-theme"></i></div>'
                            + '<div class="cert-title">' + (c.task_title || '培训证书') + '</div>'
                            + '<div class="cert-info">证书编号：' + (c.cert_no || '--') + '</div>'
                            + '<div class="cert-info">获得时间：' + (c.issue_date || '') + '</div>'
                            + '<div class="cert-info">有效期至：' + (c.expire_date || '永久有效') + '</div>'
                            + '<div class="cert-tag ' + (isValid ? 'valid' : 'expired') + '">' + (isValid ? '有效' : '已过期') + '</div>'
                            + '</div>';
                    }).join('');
                } else {
                    el.innerHTML = '<div class="empty-state"><i class="layui-icon layui-icon-theme"></i><p>暂无证书</p><p style="font-size:12px;margin-top:8px;">完成培训任务后可获得证书</p></div>';
                }
            }).catch(function() {
                document.getElementById('certList').innerHTML = '<div class="empty-state"><i class="layui-icon layui-icon-theme"></i><p>加载失败</p></div>';
            });
        }
        loadCerts();
    </script>
</body>
</html>
