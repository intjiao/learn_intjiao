<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>课程学习 - 在线培训考试系统</title>
    <link rel="stylesheet" href="https://unpkg.com/layui@2.9.23/dist/css/layui.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: #F5F7FA; }
        .page-header {
            background: linear-gradient(135deg, #1890FF, #0050B3);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .page-header .back-btn { font-size: 18px; cursor: pointer; padding: 4px; }
        .page-header h1 { font-size: 17px; font-weight: 600; flex: 1; }
        .content { padding: 16px; }
        .course-card {
            background: #fff;
            border-radius: 12px;
            margin-bottom: 14px;
            overflow: hidden;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            cursor: pointer;
        }
        .course-card:active { opacity: 0.95; }
        .course-cover {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 48px;
        }
        .course-body { padding: 14px; }
        .course-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 8px; }
        .course-desc { font-size: 13px; color: #888; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; }
        .course-meta { display: flex; gap: 16px; font-size: 12px; color: #bbb; }
        .course-meta span { display: flex; align-items: center; gap: 4px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #c0c0c0; }
        .empty-state i { font-size: 48px; margin-bottom: 12px; display: block; }
        .load-more { text-align: center; padding: 16px; font-size: 13px; color: #999; cursor: pointer; }
        .load-more:active { color: #1890FF; }
    </style>
</head>
<body>
    <div class="page-header">
        <div class="back-btn" onclick="location.href='index.html'"><i class="layui-icon layui-icon-left"></i></div>
        <h1>课程学习</h1>
    </div>

    <div class="content" id="courseList">
        <div class="empty-state"><i class="layui-icon layui-icon-loading-1"></i><p>加载中...</p></div>
    </div>

    <script src="https://unpkg.com/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://unpkg.com/layui@2.9.23/dist/layui.js"></script>
    <script src="api.js"></script>
    <script>
        if (!Api.checkLogin()) {}

        var colors = [
            'linear-gradient(135deg,#667eea,#764ba2)',
            'linear-gradient(135deg,#4ECDC4,#44A08D)',
            'linear-gradient(135deg,#FF6B6B,#FF8E53)',
            'linear-gradient(135deg,#f093fb,#f5576c)',
            'linear-gradient(135deg,#f1c40f,#f39c12)',
            'linear-gradient(135deg,#3498db,#2980b9)',
        ];

        function loadCourses() {
            Api.getCourseList(1, 20).then(function(res) {
                var el = document.getElementById('courseList');
                if (res.code === 200 && res.data && res.data.length > 0) {
                    el.innerHTML = res.data.map(function(c, i) {
                        return '<div class="course-card" onclick="location.href=\'course-detail.html?id=' + c.id + '\'">'
                            + '<div class="course-cover" style="background:' + colors[i % colors.length] + ';"><i class="layui-icon layui-icon-video"></i></div>'
                            + '<div class="course-body">'
                            + '<div class="course-title">' + c.title + '</div>'
                            + '<div class="course-desc">' + (c.description || '暂无描述') + '</div>'
                            + '<div class="course-meta">'
                            + '<span><i class="layui-icon layui-icon-user"></i> ' + (c.teacher || '未知') + '</span>'
                            + '<span><i class="layui-icon layui-icon-survey"></i> ' + (c.chapter_count || 0) + '章节</span>'
                            + '<span><i class="layui-icon layui-icon-time"></i> ' + (c.total_duration || 0) + '分钟</span>'
                            + '</div></div></div>';
                    }).join('');
                } else {
                    el.innerHTML = '<div class="empty-state"><i class="layui-icon layui-icon-video"></i><p>暂无课程</p></div>';
                }
            }).catch(function() {
                document.getElementById('courseList').innerHTML = '<div class="empty-state"><i class="layui-icon layui-icon-video"></i><p>加载失败</p></div>';
            });
        }

        loadCourses();
    </script>
</body>
</html>
