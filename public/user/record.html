<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>考试记录 - 在线培训考试系统</title>
    <link rel="stylesheet" href="https://unpkg.com/layui@2.9.23/dist/css/layui.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: #F5F7FA; }
        .page-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .page-header .back-btn { font-size: 18px; cursor: pointer; padding: 4px; }
        .page-header h1 { font-size: 17px; font-weight: 600; flex: 1; }
        .content { padding: 16px; }
        .record-card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            cursor: pointer;
        }
        .record-card:active { background: #f8f9ff; }
        .rc-top { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .rc-title { font-size: 15px; font-weight: 600; color: #333; }
        .rc-badge { padding: 2px 10px; border-radius: 12px; font-size: 12px; }
        .rc-badge.pass { background: #E8F5E9; color: #43A047; }
        .rc-badge.fail { background: #FFEBEE; color: #F44336; }
        .rc-badge.doing { background: #FFF3E0; color: #FF9800; }
        .rc-meta { display: flex; gap: 20px; font-size: 12px; color: #999; }
        .rc-score { font-size: 28px; font-weight: 700; color: #333; margin: 8px 0; }
        .rc-score small { font-size: 14px; color: #999; font-weight: 400; }
        .empty-state { text-align: center; padding: 60px 20px; color: #c0c0c0; }
        .empty-state i { font-size: 48px; margin-bottom: 12px; display: block; }
    </style>
</head>
<body>
    <div class="page-header">
        <div class="back-btn" onclick="location.href='index.html'"><i class="layui-icon layui-icon-left"></i></div>
        <h1>考试记录</h1>
    </div>
    <div class="content" id="recordList">
        <div class="empty-state"><i class="layui-icon layui-icon-loading-1"></i><p>加载中...</p></div>
    </div>
    <script src="https://unpkg.com/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://unpkg.com/layui@2.9.23/dist/layui.js"></script>
    <script src="api.js"></script>
    <script>
        if (!Api.checkLogin()) {}
        function loadRecords() {
            Api.getExamList(1, 50).then(function(res) {
                var el = document.getElementById('recordList');
                if (res.code === 200 && res.data && res.data.length > 0) {
                    el.innerHTML = res.data.map(function(r) {
                        var p = r.paper || {};
                        var statusMap = { 1: ['doing', '进行中'], 2: ['pass', '已通过'] };
                        var isFail = r.pass_status == 0 && r.status == 2;
                        var s = isFail ? ['fail', '未通过'] : (statusMap[r.status] || ['doing', '进行中']);
                        var score = r.score !== null ? r.score : '--';
                        return '<div class="record-card" onclick="location.href=\'exam-result.html?id=' + r.id + '\'">'
                            + '<div class="rc-top">'
                            + '<div class="rc-title">' + (p.title || '考试') + '</div>'
                            + '<span class="rc-badge ' + s[0] + '">' + s[1] + '</span></div>'
                            + '<div class="rc-score">' + score + '<small> / ' + (p.total_score || 100) + '分</small></div>'
                            + '<div class="rc-meta">'
                            + '<span><i class="layui-icon layui-icon-time"></i> ' + (r.submit_time || r.start_time || '') + '</span>'
                            + '<span><i class="layui-icon layui-icon-util"></i> 用时 ' + Math.round((r.duration || 0) / 60) + '分钟</span>'
                            + '</div></div>';
                    }).join('');
                } else {
                    el.innerHTML = '<div class="empty-state"><i class="layui-icon layui-icon-chart-screen"></i><p>暂无考试记录</p></div>';
                }
            }).catch(function() {
                document.getElementById('recordList').innerHTML = '<div class="empty-state"><i class="layui-icon layui-icon-chart-screen"></i><p>加载失败</p></div>';
            });
        }
        loadRecords();
    </script>
</body>
</html>
