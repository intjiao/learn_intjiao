<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>纠错本 - 在线培训考试系统</title>
    <link rel="stylesheet" href="https://unpkg.com/layui@2.9.23/dist/css/layui.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #F5F7FA; }
        .page-header {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            color: #fff;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 12px rgba(255, 107, 107, 0.22);
        }
        .page-header .back-btn { font-size: 18px; cursor: pointer; padding: 4px; }
        .page-header h1 { font-size: 17px; font-weight: 600; flex: 1; }
        .page-header .header-action {
            padding: 6px 12px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.16);
            font-size: 12px;
            cursor: pointer;
        }
        .content { padding: 16px; }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 14px;
        }
        .stat-card {
            background: #fff;
            border-radius: 12px;
            padding: 16px 12px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            text-align: center;
        }
        .stat-num { font-size: 24px; font-weight: 700; color: #FF6B6B; line-height: 1.1; }
        .stat-label { margin-top: 4px; font-size: 12px; color: #8c8c8c; }
        .toolbar {
            background: #fff;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            margin-bottom: 14px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-input {
            flex: 1;
            min-width: 180px;
            height: 38px;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 14px;
            outline: none;
        }
        .search-input:focus { border-color: #FF6B6B; }
        .btn {
            height: 38px;
            padding: 0 14px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            background: #f5f5f5;
            color: #555;
        }
        .btn.primary {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            color: #fff;
        }
        .btn:active { opacity: 0.9; }
        .list-wrap {
            display: grid;
            gap: 12px;
        }
        .wrong-card {
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
        }
        .wrong-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }
        .wrong-title {
            font-size: 15px;
            font-weight: 600;
            color: #2b2b2b;
            line-height: 1.5;
            flex: 1;
        }
        .wrong-badge {
            flex-shrink: 0;
            padding: 3px 10px;
            border-radius: 999px;
            background: #FFF0F0;
            color: #FF6B6B;
            font-size: 12px;
            height: fit-content;
        }
        .wrong-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            font-size: 12px;
            color: #8c8c8c;
            margin-bottom: 12px;
        }
        .wrong-answer-box {
            background: #FAFAFA;
            border: 1px solid #F0F0F0;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .answer-row {
            font-size: 13px;
            color: #666;
            line-height: 1.7;
        }
        .answer-row strong { color: #333; }
        .wrong-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .wrong-actions .btn { padding: 0 12px; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #bcbcbc;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
        }
        .empty-state i { font-size: 48px; margin-bottom: 12px; display: block; }
        .pager {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 16px 0 6px;
            flex-wrap: wrap;
        }
        .pager .btn { min-width: 88px; }
        @media (max-width: 768px) {
            .stat-grid { grid-template-columns: repeat(2, 1fr); }
            .page-header .header-action { display: none; }
        }
    </style>
</head>
<body>
    <div class="page-header">
        <div class="back-btn" onclick="location.href='index.html'"><i class="layui-icon layui-icon-left"></i></div>
        <h1>纠错本</h1>
        <div class="header-action" onclick="location.href='practice.html?mode=wrong'">去复习错题</div>
    </div>

    <div class="content">
        <div class="stat-grid">
            <div class="stat-card">
                <div class="stat-num" id="statWrongQuestionCount">0</div>
                <div class="stat-label">错题题目</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="statWrongTotal">0</div>
                <div class="stat-label">错题次数</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="statPracticeTimes">0</div>
                <div class="stat-label">练习次数</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="statTodayDone">0</div>
                <div class="stat-label">今日已做</div>
            </div>
        </div>

        <div class="toolbar">
            <input type="text" class="search-input" id="keywordInput" placeholder="搜索题干关键字">
            <button class="btn primary" id="btnSearch">搜索</button>
            <button class="btn" id="btnReset">重置</button>
        </div>

        <div id="wrongBookList" class="list-wrap">
            <div class="empty-state"><i class="layui-icon layui-icon-loading-1"></i><p>加载中...</p></div>
        </div>

        <div class="pager" id="pagerWrap"></div>
    </div>

    <script src="https://unpkg.com/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://unpkg.com/layui@2.9.23/dist/layui.js"></script>
    <script src="api.js"></script>
    <script>
        if (!Api.checkLogin()) {}

        var layer;
        var state = {
            page: 1,
            limit: 10,
            total: 0,
            keyword: ''
        };

        layui.use('layer', function() {
            layer = layui.layer;
        });

        function safe(text) {
            return String(text || '').replace(/[&<>"]|'/g, function(ch) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[ch];
            });
        }

        function formatDate(value) {
            if (!value) return '-';
            return String(value).replace('T', ' ').substring(0, 19);
        }

        function joinAnswers(value) {
            if (Array.isArray(value)) {
                return value.length ? value.join('、') : '--';
            }
            if (value === null || typeof value === 'undefined') {
                return '--';
            }
            var text = String(value).trim();
            return text ? text : '--';
        }

        function renderStats(data) {
            document.getElementById('statWrongQuestionCount').textContent = data.wrong_question_count || 0;
            document.getElementById('statWrongTotal').textContent = data.wrong_total || 0;
            document.getElementById('statPracticeTimes').textContent = data.practice_times || 0;
            document.getElementById('statTodayDone').textContent = data.today_done || 0;
        }

        function loadStats() {
            Api.getPracticeStats().then(function(res) {
                if (res.code === 200 && res.data) {
                    renderStats(res.data);
                }
            }).catch(function() {});
        }

        function renderList(items) {
            var el = document.getElementById('wrongBookList');
            if (!items || items.length === 0) {
                el.innerHTML = '<div class="empty-state"><i class="layui-icon layui-icon-survey"></i><p>暂无错题，继续保持</p></div>';
                return;
            }

            el.innerHTML = items.map(function(item) {
                return '<div class="wrong-card">'
                    + '<div class="wrong-top">'
                    + '<div class="wrong-title">' + safe(item.stem || '') + '</div>'
                    + '<div class="wrong-badge">' + safe(item.type_name || '错题') + '</div>'
                    + '</div>'
                    + '<div class="wrong-meta">'
                    + '<span>分类：' + safe(item.category_name || '-') + '</span>'
                    + '<span>错了 ' + (item.wrong_count || 0) + ' 次</span>'
                    + '<span>最近错误：' + safe(formatDate(item.latest_wrong_at)) + '</span>'
                    + '</div>'
                    + '<div class="wrong-answer-box">'
                    + '<div class="answer-row"><strong>你的答案：</strong>' + safe(joinAnswers(item.latest_user_answer)) + '</div>'
                    + '<div class="answer-row"><strong>正确答案：</strong>' + safe(joinAnswers(item.correct_answers && item.correct_answers.length ? item.correct_answers : item.correct_answer)) + '</div>'
                    + '</div>'
                    + '<div class="wrong-actions">'
                    + '<button class="btn primary" onclick="goPracticeWrong()">立即复习</button>'
                    + '<button class="btn" onclick="searchSameCategory(' + (item.category_id || 0) + ')">同类检索</button>'
                    + '</div>'
                    + '</div>';
            }).join('');
        }

        function renderPager() {
            var pager = document.getElementById('pagerWrap');
            var totalPages = Math.max(1, Math.ceil((state.total || 0) / state.limit));
            if (totalPages <= 1) {
                pager.innerHTML = '';
                return;
            }

            var prevDisabled = state.page <= 1 ? ' disabled' : '';
            var nextDisabled = state.page >= totalPages ? ' disabled' : '';
            pager.innerHTML = ''
                + '<button class="btn"' + prevDisabled + ' onclick="changePage(' + (state.page - 1) + ')">上一页</button>'
                + '<button class="btn" disabled>第 ' + state.page + ' / ' + totalPages + ' 页</button>'
                + '<button class="btn"' + nextDisabled + ' onclick="changePage(' + (state.page + 1) + ')">下一页</button>';
        }

        function loadWrongBook(page) {
            state.page = page || 1;
            var loading = Api.loading();
            Api.getPracticeWrongBook(state.page, state.limit, state.keyword).then(function(res) {
                Api.closeLoading(loading);
                if (res.code === 200) {
                    var items = res.data || res.list || [];
                    state.total = res.count || items.length || 0;
                    renderList(items);
                    renderPager();
                } else {
                    document.getElementById('wrongBookList').innerHTML = '<div class="empty-state"><i class="layui-icon layui-icon-close-fill"></i><p>' + safe(res.msg || '加载失败') + '</p></div>';
                }
            }).catch(function() {
                Api.closeLoading(loading);
                document.getElementById('wrongBookList').innerHTML = '<div class="empty-state"><i class="layui-icon layui-icon-close-fill"></i><p>网络异常</p></div>';
            });
        }

        function changePage(page) {
            var totalPages = Math.max(1, Math.ceil((state.total || 0) / state.limit));
            if (page < 1 || page > totalPages) return;
            loadWrongBook(page);
        }

        function searchSameCategory(categoryId) {
            if (!categoryId) {
                goPracticeWrong();
                return;
            }
            location.href = 'practice.html?mode=normal&category_id=' + categoryId;
        }

        function goPracticeWrong() {
            location.href = 'practice.html?mode=wrong';
        }

        document.getElementById('btnSearch').addEventListener('click', function() {
            state.keyword = document.getElementById('keywordInput').value.trim();
            loadWrongBook(1);
        });

        document.getElementById('btnReset').addEventListener('click', function() {
            document.getElementById('keywordInput').value = '';
            state.keyword = '';
            loadWrongBook(1);
        });

        document.getElementById('keywordInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                state.keyword = this.value.trim();
                loadWrongBook(1);
            }
        });

        loadStats();
        loadWrongBook(1);
    </script>
</body>
</html>
